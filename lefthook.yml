pre-commit:
  commands:
    guard-profiles:
      run: >
        git diff --cached --name-only | grep -E '^profiles/' | grep -v 'example.profile.json'
        && { echo "Intentas commitear un perfil personal"; exit 1; } || exit 0
    gitleaks:
      run: gitleaks protect --staged --redact
    lint:
      run: pnpm exec biome check --staged --no-errors-on-unmatched
